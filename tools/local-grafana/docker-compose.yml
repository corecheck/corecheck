name: corecheck-local-grafana

services:
  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3000:3000"
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_CONFIG_FILE: /etc/grafana/aws/config
      AWS_SHARED_CREDENTIALS_FILE: /etc/grafana/aws/empty-credentials
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: corecheck-local
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: corecheck-anchor
    depends_on:
      - renderer
      - test-names
    volumes:
      - ./provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./generated/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./generated/dashboards:/var/lib/grafana/dashboards:ro
      - ./generated:/etc/grafana/aws:ro
      - grafana-data:/var/lib/grafana
      - grafana-plugins:/var/lib/grafana/plugins
      - ./plugins/corecheck-anchor:/var/lib/grafana/plugins/corecheck-anchor:ro

  aws-credentials:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if aws configure export-credentials --format process > /out/aws-credentials.json.tmp; then
            mv /out/aws-credentials.json.tmp /out/aws-credentials.json
            chmod 644 /out/aws-credentials.json
            echo "refreshed aws credentials"
            sleep 240
          else
            rm -f /out/aws-credentials.json.tmp
            echo "aws login session is not usable; retrying in 30s" >&2
            sleep 30
          fi
        done
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/root/.aws
      - ./generated:/out

  test-names:
    image: amazon/aws-cli:latest
    entrypoint: ["python3", "/test_names.py"]
    environment:
      TEST_RESULTS_LOG_GROUP: ${TEST_RESULTS_LOG_GROUP:-/corecheck/test-results/dev}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/root/.aws
      - ./test_names.py:/test_names.py:ro

  renderer:
    image: grafana/grafana-image-renderer:latest
    environment:
      AUTH_TOKEN: corecheck-local

volumes:
  grafana-data:
  grafana-plugins:
